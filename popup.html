<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      margin: 0;
    }
    
    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    h1 span {
      font-size: 20px;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    
    .toggle-label {
      font-weight: 500;
    }
    
    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
    }
    
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 26px;
    }
    
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    .toggle input:checked + .toggle-slider {
      background-color: #4CAF50;
    }
    
    .toggle input:checked + .toggle-slider:before {
      transform: translateX(22px);
    }

    .dropdown {
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      min-width: 100px;
    }

    .dropdown:focus {
      outline: none;
      border-color: #4CAF50;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    
    .file-input-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    
    .file-btn {
      display: block;
      width: 100%;
      padding: 10px 16px;
      background: #f5f5f5;
      border: 2px dashed #ccc;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .file-btn:hover {
      background: #eee;
      border-color: #999;
    }
    
    .file-btn.has-file {
      border-style: solid;
      border-color: #4CAF50;
      background: #e8f5e9;
    }
    
    .current-sound {
      margin-top: 12px;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .current-sound-label {
      color: #666;
      margin-bottom: 6px;
    }
    
    .sound-name {
      font-weight: 500;
      word-break: break-all;
    }
    
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s;
    }
    
    .btn-play {
      background: #2196F3;
      color: white;
    }
    
    .btn-play:hover {
      background: #1976D2;
    }
    
    .btn-clear {
      background: #f44336;
      color: white;
    }
    
    .btn-clear:hover {
      background: #d32f2f;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    
    .status.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }
    
    .status.error {
      display: block;
      background: #ffebee;
      color: #c62828;
    }
    
    .info {
      margin-top: 16px;
      padding: 10px;
      background: #e3f2fd;
      border-radius: 6px;
      font-size: 12px;
      color: #1565c0;
    }

    .no-sound {
      color: #999;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1><span>🎰</span> PokerNow Sound Replacer</h1>
  
  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">Enable Sound Replacement</span>
      <label class="toggle">
        <input type="checkbox" id="enableToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">AI Assistant</span>
      <select id="aiProvider" class="dropdown">
        <option value="off">Off</option>
        <option value="gemini">Gemini</option>
        <option value="claude">Claude</option>
        <option value="chatgpt">ChatGPT</option>
      </select>
    </div>
  </div>
  
  <div class="section">
    <label>Custom "Your Turn" Sound</label>
    <div class="file-input-wrapper">
      <div class="file-btn" id="fileBtn">
        📁 Click to select audio file (.mp3, .wav, .ogg)
      </div>
      <input type="file" id="soundFile" accept="audio/*">
    </div>
    
    <div class="current-sound" id="currentSound" style="display: none;">
      <div class="current-sound-label">Current sound:</div>
      <div class="sound-name" id="soundName"></div>
      <div class="btn-row">
        <button class="btn-play" id="playBtn">▶ Preview</button>
        <button class="btn-clear" id="clearBtn">✕ Remove</button>
      </div>
    </div>
  </div>
  
  <div class="status" id="status"></div>
  
  <div class="info">
    💡 Upload any audio file to replace the default "your turn" notification sound on PokerNow.
  </div>

  <script src="popup.js"></script>
</body>
</html>
